<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — StudyBuddy NCI</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <span class="nav-brand">StudyBuddy NCI</span>
      <div class="nav-links">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/search.html">Find a Buddy</a>
        <a href="/profile.html">My Profile</a>
        <button id="logout-btn" class="btn-nav">Logout</button>
      </div>
    </nav>

    <div class="container">
      <h2>Welcome back, <span id="user-name"></span></h2>
      <p>Here is a summary of your study connections.</p>

      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-num" id="confirmed-count">0</div>
          <div class="stat-label">Confirmed buddies</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="pending-count">0</div>
          <div class="stat-label">Pending requests</div>
        </div>
      </div>

      <h3>Incoming Requests</h3>
      <div id="pending-requests">
        <p class="empty-msg">No pending requests.</p>
      </div>

      <h3>Your Confirmed Study Buddies</h3>
      <div id="confirmed-buddies">
        <p class="empty-msg">
          No confirmed buddies yet. Go find a study buddy!
        </p>
      </div>
    </div>

    <script src="/js/dashboard.js"></script>
  </body>
</html>
