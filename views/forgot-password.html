<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password — StudyBuddy NCI</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/theme.js"></script>
  </head>
  <body class="forgot-password-page">
    <div class="form-container">
      <h1>StudyBuddy NCI</h1>
      <h2>Forgot your password?</h2>
      <p>Answer your security question to reset your password.</p>

      <div id="error-message" class="error-box" style="display: none"></div>
      <div id="success-message" class="success-box" style="display: none"></div>

      <form id="email-form">
        <div class="form-group">
          <label>Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="your@email.com"
            required
          />
        </div>
        <button type="submit" class="btn-primary full-width">
          Find Account
        </button>
      </form>

      <form id="reset-form" style="display: none">
        <div class="form-group">
          <label id="security-question-label"></label>
          <input
            type="text"
            id="security_answer"
            placeholder="Your answer"
            required
          />
        </div>
        <div class="form-group">
          <label>New Password (min. 8 characters)</label>
          <input
            type="password"
            id="new_password"
            placeholder="••••••••"
            required
          />
        </div>
        <button type="submit" class="btn-primary full-width">
          Reset Password
        </button>
      </form>

      <p class="form-footer">
        Remembered your password? <a href="/login.html">Log in here</a>
      </p>
    </div>

    <script src="/js/forgot-password.js"></script>
  </body>
</html>
