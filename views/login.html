<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — StudyBuddy NCI</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/theme.js"></script>
  </head>
  <body class="login-page">
    <div class="form-container">
      <h1>StudyBuddy NCI</h1>
      <h2>Welcome back</h2>
      <p>Log in to find your study buddy.</p>

      <div id="error-message" class="error-box" style="display: none"></div>

      <form id="login-form">
        <div class="form-group">
          <label>Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="your@email.com"
            required
          />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
          />
        </div>
        <button type="submit" class="btn-primary full-width">Log In</button>
      </form>
      <p class="form-footer">
        <a href="/forgot-password.html">Forgot Password?</a>
      </p>
      <p class="form-footer">
        No account? <a href="/register.html">Register here</a>
      </p>
    </div>

    <script src="/js/login.js"></script>
  </body>
</html>
