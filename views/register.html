<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — StudyBuddy NCI</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/theme.js"></script>
  </head>
  <body class="register-page">
    <div class="form-container">
      <h1>StudyBuddy NCI</h1>
      <h2>Create your account</h2>
      <p>All fields are required.</p>

      <div id="error-message" class="error-box" style="display: none"></div>
      <div id="success-message" class="success-box" style="display: none"></div>

      <form id="register-form">
        <div class="form-group">
          <label>Full Name</label>
          <input
            type="text"
            id="full_name"
            placeholder="e.g. Ose Murphy"
            required
          />
        </div>
        <div class="form-group">
          <label>NCI Student Email</label>
          <input
            type="email"
            id="email"
            placeholder="e.g. x00000000@student.ncirl.ie"
            required
          />
        </div>
        <div class="form-group">
          <label>Course Name</label>
          <input
            type="text"
            id="course"
            placeholder="e.g. Higher Diploma in Computing"
            required
          />
        </div>
        <div class="form-group">
          <label>Password (min. 8 characters)</label>
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
          />
        </div>
        <div class="form-group">
          <label>Security Question</label>
          <select id="security_question" required>
            <option value="">Select a question</option>
            <option value="What was the name of your first school?">
              What was the name of your first school?
            </option>
            <option value="What is your mother's maiden name?">
              What is your mother's maiden name?
            </option>
            <option value="What was the name of your first pet?">
              What was the name of your first pet?
            </option>
          </select>
        </div>
        <div class="form-group">
          <label>Security Answer</label>
          <input
            type="text"
            id="security_answer"
            placeholder="Your answer"
            required
          />
        </div>
        <button type="submit" class="btn-primary full-width">
          Create Account
        </button>
      </form>
      <p class="form-footer">
        Already registered? <a href="/login.html">Log in here</a>
      </p>
    </div>

    <script src="/js/register.js"></script>
  </body>
</html>
